name: Build OpenBOR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install UCRT64 build dependencies
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-zlib

      - name: Build, test and package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./engine/libretro/build.ps1 -MsysRoot $env:MSYS2_LOCATION

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-windows-x64
          path: dist/openbor-libretro-win64/
          if-no-files-found: error

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-build-diagnostics
          path: |
            engine/libretro/build-win64/Testing/Temporary/
            engine/libretro/build-win64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: windows-x64
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested core
        uses: actions/download-artifact@v4
        with:
          name: OpenBOR-windows-x64
          path: package

      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath openbor-libretro-win64.zip
          $hash = (Get-FileHash -Algorithm SHA256 openbor-libretro-win64.zip).Hash
          "$hash  openbor-libretro-win64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish tested version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:SOURCE_REF.StartsWith('refs/tags/')) {
            $tag = $env:SOURCE_NAME
            $tagOptions = @('--verify-tag')
          } else {
            $tag = "build-$env:BUILD_NUMBER-$($env:SOURCE_SHA.Substring(0, 7))"
            $tagOptions = @('--target', $env:SOURCE_SHA)
          }
          # Re-running the same build repairs/uploads its assets without
          # creating another release or moving an existing tag.
          gh release view "$tag" --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" openbor-libretro-win64.zip SHA256SUMS.txt --clobber
          } else {
            gh release create "$tag" openbor-libretro-win64.zip SHA256SUMS.txt @tagOptions --title "OpenBOR $tag" --generate-notes
          }
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
